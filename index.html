<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Issue List Management</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f6fa;
        color: #222;
    }

    body {
        min-height: 100vh;
    }

    /* =========================
       HEADER
       ========================= */

    .header {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: #ffffff;
        border-bottom: 1px solid #ddd;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
    }

    .header-inner {
        padding: 14px 20px;
    }

    .title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 12px;
    }

    /* =========================
       SEARCH
       ========================= */

    .search-area {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }

    .search-area input {
        height: 38px;
        padding: 0 12px;
        border: 1px solid #bbb;
        border-radius: 6px;
        font-size: 14px;
        min-width: 220px;
        flex: 1;
    }

    .search-area input:focus {
        outline: none;
        border-color: #555;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.08);
    }

    /* =========================
       FILTER BUTTONS
       ========================= */

    .filter-area {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        align-items: center;
    }

    .filter-btn {
        border: none;
        border-radius: 5px;
        padding: 8px 13px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.15s;
        background: #e5e7eb;
        color: #222;
    }

    .filter-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
    }

    .filter-btn.active {
        outline: 3px solid rgba(0, 0, 0, 0.15);
        transform: translateY(-1px);
    }

    .bu-btn {
        background: #1976d2;
        color: white;
    }

    .clear-btn {
        background: #d32f2f;
        color: white;
    }

    /* =========================
       TABLE
       ========================= */

    .table-container {
        margin: 15px 20px 0 20px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 7px;
        overflow: auto;
        max-height: calc(100vh - 220px);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1100px;
    }

    thead th {
        position: sticky;
        top: 0;
        z-index: 10;
        background: #222;
        color: white;
        padding: 10px 8px;
        border: 1px solid #444;
        text-align: center;
        font-size: 13px;
        white-space: nowrap;
    }

    tbody td {
        border: 1px solid #ddd;
        padding: 8px;
        font-size: 13px;
        vertical-align: top;
    }

    tbody tr:nth-child(even) {
        background: #fafafa;
    }

    tbody tr:hover {
        background: #f0f4ff;
    }

    /* Column widths */

    th:nth-child(1),
    td:nth-child(1) {
        width: 120px;
        min-width: 120px;
        text-align: center;
    }

    th:nth-child(2),
    td:nth-child(2) {
        width: 230px;
        min-width: 230px;
    }

    th:nth-child(3),
    td:nth-child(3) {
        width: 520px;
        min-width: 450px;
        white-space: pre-line;
        line-height: 1.45;
    }

    th:nth-child(4),
    td:nth-child(4) {
        width: 130px;
        min-width: 120px;
        text-align: center;
    }

    th:nth-child(5),
    td:nth-child(5),
    th:nth-child(6),
    td:nth-child(6) {
        width: 100px;
        min-width: 90px;
        text-align: center;
    }

    /* =========================
       STATUS
       ========================= */

    .status {
        display: inline-block;
        padding: 5px 9px;
        border-radius: 5px;
        font-size: 11px;
        font-weight: bold;
        white-space: nowrap;
    }

    .status-monitoring {
        background: #fff3cd;
        color: #856404;
    }

    .status-closed {
        background: #d4edda;
        color: #155724;
    }

    .status-ng {
        background: #f8d7da;
        color: #721c24;
    }

    .status-open {
        background: #cce5ff;
        color: #004085;
    }

    .status-default {
        background: #e2e3e5;
        color: #383d41;
    }

    /* =========================
       OPEN BUTTON
       ========================= */

    .open-btn {
        display: inline-block;
        padding: 6px 13px;
        background: #1976d2;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.15s;
    }

    .open-btn:hover {
        background: #125aa0;
        transform: translateY(-1px);
    }

    /* =========================
       PAGINATION
       ========================= */

    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        padding: 14px 10px 20px 10px;
        flex-wrap: wrap;
    }

    .page-btn {
        border: 1px solid #bbb;
        background: white;
        border-radius: 5px;
        padding: 7px 14px;
        cursor: pointer;
        font-size: 13px;
    }

    .page-btn:hover:not(:disabled) {
        background: #eee;
    }

    .page-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .page-info {
        font-size: 13px;
        font-weight: bold;
    }

    /* =========================
       RECORD COUNT
       ========================= */

    .record-info {
        margin: 10px 20px 0 20px;
        font-size: 13px;
        color: #555;
    }

    /* =========================
       LOADING / EMPTY
       ========================= */

    .message {
        text-align: center;
        padding: 30px;
        color: #666;
        font-size: 14px;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 768px) {

        .header-inner {
            padding: 10px;
        }

        .title {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .search-area {
            flex-direction: column;
        }

        .search-area input {
            width: 100%;
            min-width: 0;
        }

        .filter-area {
            gap: 5px;
        }

        .filter-btn {
            padding: 7px 10px;
            font-size: 12px;
        }

        .table-container {
            margin: 10px;
            max-height: calc(100vh - 270px);
        }

        .record-info {
            margin: 8px 10px 0 10px;
        }

        table {
            min-width: 1050px;
        }
    }
</style>
</head>

<body>

<!-- =========================
     HEADER
     ========================= -->

<div class="header">
    <div class="header-inner">

        <div class="title">
            Issue List
        </div>

        <!-- Search -->
        <div class="search-area">

            <input
                type="text"
                id="searchIssue"
                placeholder="Search Issue and Request..."
                oninput="applyFilter()"
            >

            <input
                type="text"
                id="searchSite"
                placeholder="Search Site..."
                oninput="applyFilter()"
            >

            <input
                type="text"
                id="searchStatus"
                placeholder="Search Status..."
                oninput="applyFilter()"
            >

        </div>

        <!-- Filters -->
        <div class="filter-area">

            <button
                class="filter-btn bu-btn"
                id="btnBU4"
                onclick="selectBU('BU4')">
                BU4
            </button>

            <button
                class="filter-btn bu-btn"
                id="btnD7"
                onclick="selectBU('D7')">
                D7
            </button>

            <button
                class="filter-btn bu-btn"
                id="btnBU11"
                onclick="selectBU('BU11')">
                BU11
            </button>

            <button
                class="filter-btn clear-btn"
                onclick="clearFilter()">
                CLEAR
            </button>

        </div>

    </div>
</div>


<!-- =========================
     RECORD INFO
     ========================= -->

<div class="record-info" id="recordInfo">
    Loading...
</div>


<!-- =========================
     TABLE
     ========================= -->

<div class="table-container">

    <table>

        <thead>
            <tr>
                <th>DATE</th>
                <th>SITE</th>
                <th>ISSUE AND REQUEST</th>
                <th>STATUS</th>
                <th>MEMORY</th>
                <th>CC LINK</th>
            </tr>
        </thead>

        <tbody id="tableBody">
        </tbody>

    </table>

</div>


<!-- =========================
     PAGINATION
     ========================= -->

<div class="pagination">

    <button
        class="page-btn"
        id="prevBtn"
        onclick="previousPage()">
        Previous
    </button>

    <span
        class="page-info"
        id="pageInfo">
        Page 1
    </span>

    <button
        class="page-btn"
        id="nextBtn"
        onclick="nextPage()">
        Next
    </button>

</div>


<script>

/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let allData = [];
let filteredData = [];

let currentPage = 1;

const rowsPerPage = 50;

let selectedBU = null;


/* =========================================================
   BU DATA
   ========================================================= */

let BU4Data = [];
let D7Data = [];
let BU11Data = [];


/* =========================================================
   LOAD JSON
   ========================================================= */

async function loadData() {

    try {

        const results = await Promise.all([

            fetch("data.json"),
            fetch("BU4.json"),
            fetch("D7.json"),
            fetch("BU11.json")

        ]);

        for (const response of results) {

            if (!response.ok) {

                throw new Error(
                    "Failed to load: " + response.url
                );

            }

        }

        allData = await results[0].json();
        BU4Data = await results[1].json();
        D7Data = await results[2].json();
        BU11Data = await results[3].json();

        /*
         * Sort by DATE descending
         * Newest issue appears first.
         */
        allData.sort(function(a, b) {

            const dateA = new Date(a["DATE"] || 0);
            const dateB = new Date(b["DATE"] || 0);

            return dateB - dateA;

        });

        filteredData = [...allData];

        renderTable();

    } catch (error) {

        console.error(error);

        document.getElementById("tableBody").innerHTML = `
            <tr>
                <td colspan="6" class="message">
                    Failed to load data.
                    Please check data.json,
                    BU4.json,
                    D7.json and BU11.json.
                </td>
            </tr>
        `;

        document.getElementById("recordInfo").textContent =
            "Data loading error.";

    }

}


/* =========================================================
   SELECT BU
   ========================================================= */

function selectBU(bu) {

    /*
     * Click the same BU button again
     * to cancel the filter.
     */

    if (selectedBU === bu) {

        selectedBU = null;

    } else {

        selectedBU = bu;

    }

    currentPage = 1;

    updateBUButtons();

    applyFilter();

}


/* =========================================================
   UPDATE BU BUTTON STATUS
   ========================================================= */

function updateBUButtons() {

    const buttons = {

        BU4: document.getElementById("btnBU4"),
        D7: document.getElementById("btnD7"),
        BU11: document.getElementById("btnBU11")

    };

    Object.keys(buttons).forEach(function(bu) {

        buttons[bu].classList.remove("active");

    });

    if (selectedBU && buttons[selectedBU]) {

        buttons[selectedBU].classList.add("active");

    }

}


/* =========================================================
   GET BU SITE VALUE
   ========================================================= */

function getBUValue(bu) {

    if (bu === "BU4") {

        return BU4Data[0] || "";

    }

    if (bu === "D7") {

        return D7Data[0] || "";

    }

    if (bu === "BU11") {

        return BU11Data[0] || "";

    }

    return "";

}


/* =========================================================
   FILTER
   ========================================================= */

function applyFilter() {

    const issueText =
        document
            .getElementById("searchIssue")
            .value
            .trim()
            .toLowerCase();

    const siteText =
        document
            .getElementById("searchSite")
            .value
            .trim()
            .toLowerCase();

    const statusText =
        document
            .getElementById("searchStatus")
            .value
            .trim()
            .toLowerCase();


    filteredData = allData.filter(function(item) {

        const issue =
            String(item["ISSUE AND REQUEST"] || "")
                .toLowerCase();

        const site =
            String(item["SITE"] || "")
                .toLowerCase();

        const status =
            String(item["STATUS"] || "")
                .toLowerCase();


        /* Search Issue */

        if (
            issueText &&
            !issue.includes(issueText)
        ) {

            return false;

        }


        /* Search Site */

        if (
            siteText &&
            !site.includes(siteText)
        ) {

            return false;

        }


        /* Search Status */

        if (
            statusText &&
            !status.includes(statusText)
        ) {

            return false;

        }


        /* BU Filter */

        if (selectedBU) {

            const buValue =
                getBUValue(selectedBU)
                    .toLowerCase();

            if (!site.includes(buValue)) {

                return false;

            }

        }


        return true;

    });


    currentPage = 1;

    renderTable();

}


/* =========================================================
   CREATE OPEN BUTTON
   ========================================================= */

function createOpenButton(value) {

    if (!value) {

        return "";

    }

    const link =
        String(value).trim();


    /*
     * Do not create button for
     * NOT AVAILABLE.
     */

    if (
        link === "" ||
        link.toUpperCase() === "NOT AVAILABLE"
    ) {

        return "";

    }


    /*
     * Only allow HTTP/HTTPS links.
     */

    if (
        !/^https?:\/\//i.test(link)
    ) {

        return "";

    }


    return `
        <a
            class="open-btn"
            href="${escapeAttribute(link)}"
            target="_blank"
            rel="noopener noreferrer">
            Open
        </a>
    `;

}


/* =========================================================
   STATUS HTML
   ========================================================= */

function createStatus(value) {

    if (!value) {

        return "";

    }

    const status =
        String(value).trim();

    const normalized =
        status
            .toLowerCase()
            .replace(/\s+/g, "-");


    let className = "status-default";


    if (normalized === "monitoring") {

        className = "status-monitoring";

    } else if (normalized === "closed") {

        className = "status-closed";

    } else if (normalized === "ng") {

        className = "status-ng";

    } else if (normalized === "open") {

        className = "status-open";

    }


    return `
        <span class="status ${className}">
            ${escapeHTML(status)}
        </span>
    `;

}


/* =========================================================
   FORMAT DATE
   ========================================================= */

function formatDate(value) {

    if (!value) {

        return "";

    }

    const date = new Date(value);

    if (isNaN(date.getTime())) {

        return escapeHTML(String(value));

    }


    const year = date.getFullYear();

    const month =
        String(date.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(date.getDate())
            .padStart(2, "0");


    return `${year}-${month}-${day}`;

}


/* =========================================================
   RENDER TABLE
   ========================================================= */

function renderTable() {

    const tableBody =
        document.getElementById("tableBody");

    const recordInfo =
        document.getElementById("recordInfo");

    const pageInfo =
        document.getElementById("pageInfo");

    const prevBtn =
        document.getElementById("prevBtn");

    const nextBtn =
        document.getElementById("nextBtn");


    const totalRecords =
        filteredData.length;


    const totalPages =
        Math.max(
            1,
            Math.ceil(
                totalRecords / rowsPerPage
            )
        );


    if (currentPage > totalPages) {

        currentPage = totalPages;

    }


    const startIndex =
        (currentPage - 1) * rowsPerPage;

    const endIndex =
        Math.min(
            startIndex + rowsPerPage,
            totalRecords
        );


    const pageData =
        filteredData.slice(
            startIndex,
            endIndex
        );


    /* Record information */

    if (totalRecords === 0) {

        recordInfo.textContent =
            "0 records";

    } else {

        recordInfo.textContent =
            `Showing ${startIndex + 1}-${endIndex} of ${totalRecords} records`;

    }


    /* Empty */

    if (pageData.length === 0) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="6" class="message">
                    No records found.
                </td>
            </tr>
        `;

    } else {

        tableBody.innerHTML =
            pageData.map(function(item) {

                const date =
                    formatDate(item["DATE"]);

                const site =
                    escapeHTML(
                        item["SITE"] || ""
                    );

                const issue =
                    escapeHTML(
                        item["ISSUE AND REQUEST"] || ""
                    );

                const status =
                    createStatus(
                        item["STATUS"]
                    );

                const memory =
                    createOpenButton(
                        item["MEMORY"]
                    );

                const ccLink =
                    createOpenButton(
                        item["CC LINK"]
                    );


                return `
                    <tr>

                        <td>
                            ${date}
                        </td>

                        <td>
                            ${site}
                        </td>

                        <td>
                            ${issue}
                        </td>

                        <td>
                            ${status}
                        </td>

                        <td>
                            ${memory}
                        </td>

                        <td>
                            ${ccLink}
                        </td>

                    </tr>
                `;

            }).join("");

    }


    /* Pagination */

    pageInfo.textContent =
        `Page ${currentPage} / ${totalPages}`;


    prevBtn.disabled =
        currentPage <= 1;


    nextBtn.disabled =
        currentPage >= totalPages;

}


/* =========================================================
   PREVIOUS PAGE
   ========================================================= */

function previousPage() {

    if (currentPage > 1) {

        currentPage--;

        renderTable();

        scrollToTop();

    }

}


/* =========================================================
   NEXT PAGE
   ========================================================= */

function nextPage() {

    const totalPages =
        Math.max(
            1,
            Math.ceil(
                filteredData.length / rowsPerPage
            )
        );


    if (currentPage < totalPages) {

        currentPage++;

        renderTable();

        scrollToTop();

    }

}


/* =========================================================
   CLEAR FILTER
   ========================================================= */

function clearFilter() {

    document.getElementById("searchIssue").value = "";
    document.getElementById("searchSite").value = "";
    document.getElementById("searchStatus").value = "";

    selectedBU = null;

    currentPage = 1;

    updateBUButtons();

    filteredData = [...allData];

    renderTable();

}


/* =========================================================
   SCROLL TO TOP
   ========================================================= */

function scrollToTop() {

    const container =
        document.querySelector(
            ".table-container"
        );

    if (container) {

        container.scrollTop = 0;

    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   ESCAPE ATTRIBUTE
   ========================================================= */

function escapeAttribute(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


/* =========================================================
   START
   ========================================================= */

loadData();

</script>

</body>
</html>
