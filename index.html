<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Issue List</title>

<!-- PLOTLY -->
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>


<style>

/* =========================
   GLOBAL
   ========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6fa;
    color: #222;
}

body {
    min-height: 100vh;
}


/* =========================
   HEADER
   ========================= */

.header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #ffffff;
    border-bottom: 1px solid #ddd;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
}

.header-inner {
    padding: 14px 20px;
}

.title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 12px;
}


/* =========================
   SEARCH
   ========================= */

.search-area {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.search-area input {
    height: 38px;
    padding: 0 12px;
    border: 1px solid #bbb;
    border-radius: 6px;
    font-size: 14px;
    min-width: 220px;
    flex: 1;
}

.search-area input:focus {
    outline: none;
    border-color: #555;
    box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.08);
}


/* =========================
   FILTER BUTTONS
   ========================= */

.filter-area {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    align-items: center;
}

.filter-btn {
    border: none;
    border-radius: 5px;
    padding: 8px 13px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.15s ease;
}

.filter-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
}


/* =========================
   ACTIVE BUTTON
   ========================= */

.filter-btn.active {
    border: 2px solid #ff0000;

    box-shadow:
        0 4px 8px rgba(0, 0, 0, 0.30),
        0 0 0 2px rgba(255, 0, 0, 0.15);

    transform: translateY(-2px);
}


/* =========================
   BU FILTER
   ========================= */

.bu-btn {
    background: #1976d2;
    color: white;
}


/* =========================
   STATUS FILTER
   ========================= */

.status-filter-btn {
    color: white;
}


/* OPEN CASE = RED */

.open-case-btn {
    background: #dc3545;
}


/* CLOSE CASE = GREEN */

.close-case-btn {
    background: #198754;
}


/* MONITORING = ORANGE */

.monitoring-case-btn {
    background: #d97706;
}


/* =========================
   CLEAR
   ========================= */

.clear-btn {
    background: #d32f2f;
    color: white;
}


/* =========================
   STATUS CHART
   ========================= */

/*
 * Default:
 * Chart is hidden.
 * Only Show graph button remains.
 */

.chart-container {

    margin: 10px 20px 0 20px;

    background: #ffffff;

    border: 1px solid #ddd;

    border-radius: 7px;

    padding: 5px;

    height: 45px;

    overflow: hidden;

    transition:
        height 0.25s ease,
        padding 0.25s ease;

}


/*
 * Chart visible
 */

.chart-container.show-chart {

    height: 360px;

    padding: 10px;

}


.chart-header {

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    min-height: 30px;

}


.chart-title {

    text-align: center;

    font-size: 16px;

    font-weight: bold;

}


.chart-toggle-btn {

    position: absolute;

    right: 0;

    top: 0;

    border: none;

    border-radius: 5px;

    padding: 6px 10px;

    background: #555;

    color: white;

    font-size: 11px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.15s ease;

}


.chart-toggle-btn:hover {

    background: #333;

    transform: translateY(-1px);

}


/*
 * Hide title when chart is hidden.
 */

.chart-container:not(.show-chart) .chart-title {

    display: none;

}


/*
 * Center Show graph button
 * when chart is hidden.
 */

.chart-container:not(.show-chart) .chart-header {

    min-height: 33px;

}


.chart-container:not(.show-chart)
.chart-toggle-btn {

    position: static;

}


/*
 * Chart itself
 */

#statusChart {

    width: 100%;

    height: 320px;

}


/* =========================
   PAGINATION TOP
   ========================= */

.pagination-top {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 12px 10px;
    flex-wrap: wrap;
    background: #ffffff;
    border-bottom: 1px solid #ddd;
}

.page-btn {
    border: 1px solid #bbb;
    background: white;
    border-radius: 5px;
    padding: 7px 14px;
    cursor: pointer;
    font-size: 13px;
}

.page-btn:hover:not(:disabled) {
    background: #eee;
}

.page-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.page-info {
    font-size: 13px;
    font-weight: bold;
}


/* =========================
   RECORD COUNT
   ========================= */

.record-info {
    margin: 10px 20px 0 20px;
    font-size: 13px;
    color: #555;
}


/* =========================
   TABLE
   ========================= */

.table-container {
    margin: 10px 20px 0 20px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 7px;
    overflow: auto;
    max-height: calc(100vh - 280px);
}


table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
}


/* =========================
   TABLE HEADER
   ========================= */

thead th {
    position: sticky;
    top: 0;
    z-index: 10;

    background: #222;
    color: white;

    padding: 10px 6px;

    /*
     * CHANGED:
     * Black -> Gray
     */

    border: 1px solid #ddd;

    text-align: center;

    font-size: 13px;

    white-space: normal;

    word-break: break-word;
}


/* =========================
   TABLE BODY
   ========================= */

tbody td {

    /*
     * CHANGED:
     * Black -> Gray
     */

    border: 1px solid #ddd;

    padding: 8px 6px;

    font-size: 13px;

    vertical-align: top;

    overflow-wrap: anywhere;

    word-break: break-word;
}

tbody tr:nth-child(even) {
    background: #fafafa;
}

tbody tr:hover {
    filter: brightness(0.97);
}


/* =========================
   COLUMN WIDTH
   ========================= */


/* DATE */

th:nth-child(1),
td:nth-child(1) {
    width: 10%;
    text-align: center;
}


/* SITE */

th:nth-child(2),
td:nth-child(2) {
    width: 16%;
}


/* ISSUE AND REQUEST */

th:nth-child(3),
td:nth-child(3) {

    width: 40%;

    white-space: pre-line;

    text-align: left;
}


/* STATUS */

th:nth-child(4),
td:nth-child(4) {

    width: 14%;

    text-align: center;
}


/* LOG */

th:nth-child(5),
td:nth-child(5) {

    width: 10%;

    text-align: center;
}


/* CC LINK */

th:nth-child(6),
td:nth-child(6) {

    width: 10%;

    text-align: center;
}


/* =========================
   STATUS ROW COLORS
   ========================= */

tbody tr.open-case-row {
    background: #f8d7da !important;
}

tbody tr.open-case-row:hover {
    background: #f1bfc3 !important;
}


tbody tr.closed-case-row {
    background: #d4edda !important;
}

tbody tr.closed-case-row:hover {
    background: #bee5c5 !important;
}


tbody tr.monitoring-case-row {
    background: #ffe5c2 !important;
}

tbody tr.monitoring-case-row:hover {
    background: #ffd59f !important;
}


/* =========================
   STATUS BADGE
   ========================= */

.status {
    display: inline-block;

    padding: 5px 7px;

    border-radius: 5px;

    font-size: 11px;

    font-weight: bold;

    white-space: nowrap;

    max-width: 100%;
}

.status-monitoring {
    background: #fff3cd;
    color: #856404;
}

.status-closed {
    background: #d4edda;
    color: #155724;
}

.status-ng {
    background: #f8d7da;
    color: #721c24;
}

.status-open {
    background: #dc3545;
    color: white;
}

.status-default {
    background: #e2e3e5;
    color: #383d41;
}


/* =========================
   OPEN BUTTON
   ========================= */

.open-btn {
    display: inline-block;

    padding: 6px 8px;

    background: #1976d2;

    color: white;

    text-decoration: none;

    border-radius: 5px;

    font-size: 11px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.15s;
}

.open-btn:hover {
    background: #125aa0;

    transform: translateY(-1px);
}


/* =========================
   EMPTY / LOADING
   ========================= */

.message {
    text-align: center;

    padding: 30px;

    color: #666;

    font-size: 14px;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 768px) {

    .header-inner {
        padding: 10px;
    }


    .title {
        font-size: 20px;

        margin-bottom: 10px;
    }


    .search-area {
        flex-direction: column;
    }


    .search-area input {
        width: 100%;

        min-width: 0;
    }


    .filter-area {
        gap: 5px;
    }


    .filter-btn {
        padding: 7px 9px;

        font-size: 11px;
    }


    /* =========================
       CHART MOBILE
       ========================= */

    .chart-container {

        margin: 10px;

        height: 40px;

        padding: 4px;

    }


    .chart-container.show-chart {

        height: 300px;

        padding: 5px;

    }


    .chart-title {

        font-size: 14px;

    }


    .chart-toggle-btn {

        font-size: 9px;

        padding: 5px 8px;

    }


    #statusChart {

        height: 265px;

    }


    .pagination-top {
        padding: 10px 5px;
    }


    .table-container {

        margin: 10px;

        max-height: calc(100vh - 330px);

        overflow-x: hidden;

    }


    .record-info {

        margin: 8px 10px 0 10px;

    }


    thead th {

        padding: 8px 3px;

        font-size: 11px;

    }


    tbody td {

        padding: 7px 3px;

        font-size: 11px;

        vertical-align: top;

    }


    /* STATUS */

    .status {

        font-size: 8px;

        padding: 4px 4px;

        white-space: normal;

    }


    /* OPEN BUTTON */

    .open-btn {

        font-size: 6px;

        padding: 5px 4px;

    }

}


/* =========================
   VERY SMALL PHONE
   ========================= */

@media (max-width: 400px) {

    .filter-btn {

        padding: 6px 7px;

        font-size: 10px;

    }


    thead th {

        font-size: 10px;

    }


    tbody td {

        font-size: 10px;

        vertical-align: top;

    }


    .page-btn {

        padding: 6px 9px;

        font-size: 11px;

    }


    .chart-container.show-chart {

        height: 270px;

    }


    #statusChart {

        height: 235px;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<div class="header">

    <div class="header-inner">

        <div class="title">
            Issue List
        </div>


        <!-- SEARCH -->

        <div class="search-area">

            <input
                type="text"
                id="searchIssue"
                placeholder="Search Issue and Request..."
                oninput="applyFilter()"
            >

        </div>


        <!-- FILTERS -->

        <div class="filter-area">


            <!-- BU FILTERS -->

            <button
                class="filter-btn bu-btn"
                id="btnBU4"
                onclick="selectBU('BU4')">

                BU4

            </button>


            <button
                class="filter-btn bu-btn"
                id="btnD7"
                onclick="selectBU('D7')">

                D7

            </button>


            <button
                class="filter-btn bu-btn"
                id="btnBU11"
                onclick="selectBU('BU11')">

                BU11

            </button>


            <!-- STATUS FILTERS -->

            <button
                class="filter-btn status-filter-btn open-case-btn"
                id="btnOpenCase"
                onclick="selectStatus('open')">

                OPEN CASE

            </button>


            <button
                class="filter-btn status-filter-btn close-case-btn"
                id="btnCloseCase"
                onclick="selectStatus('closed')">

                CLOSE CASE

            </button>


            <button
                class="filter-btn status-filter-btn monitoring-case-btn"
                id="btnMonitoringCase"
                onclick="selectStatus('monitoring')">

                Monitoring CASE

            </button>


            <!-- CLEAR -->

            <button
                class="filter-btn clear-btn"
                onclick="clearFilter()">

                CLEAR

            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     STATUS CHART
     ========================================================= -->

<div
    class="chart-container"
    id="chartContainer"
>

    <div class="chart-header">

        <div class="chart-title">
            Issue Status Overview
        </div>


        <button
            class="chart-toggle-btn"
            id="chartToggleBtn"
            onclick="toggleChart()">

            Show graph

        </button>

    </div>


    <div id="statusChart"></div>

</div>


<!-- =========================================================
     PAGINATION
     ========================================================= -->

<div class="pagination-top">

    <button
        class="page-btn"
        id="prevBtn"
        onclick="previousPage()">

        Previous

    </button>


    <span
        class="page-info"
        id="pageInfo">

        Page 1

    </span>


    <button
        class="page-btn"
        id="nextBtn"
        onclick="nextPage()">

        Next

    </button>

</div>


<!-- =========================================================
     RECORD INFO
     ========================================================= -->

<div
    class="record-info"
    id="recordInfo">

    Loading...

</div>


<!-- =========================================================
     TABLE
     ========================================================= -->

<div class="table-container">

    <table>

        <thead>

            <tr>

                <th>DATE</th>

                <th>SITE</th>

                <th>ISSUE AND REQUEST</th>

                <th>STATUS</th>

                <th>LOG</th>

                <th>CC LINK</th>

            </tr>

        </thead>


        <tbody id="tableBody">
        </tbody>

    </table>

</div>


<script>


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let allData = [];

let filteredData = [];

let currentPage = 1;

const rowsPerPage = 50;

let selectedBU = null;

let selectedStatus = null;


/* =========================
   CHART CONTROL
   ========================= */

let statusChartLoaded = false;

let chartVisible = false;


/* =========================================================
   BU DATA
   ========================================================= */

let BU4Data = [];

let D7Data = [];

let BU11Data = [];


/* =========================================================
   TOGGLE CHART
   ========================================================= */

function toggleChart() {

    const container =
        document.getElementById(
            "chartContainer"
        );


    const button =
        document.getElementById(
            "chartToggleBtn"
        );


    chartVisible =
        !chartVisible;


    if (chartVisible) {

        container.classList.add(
            "show-chart"
        );


        button.textContent =
            "Hide Graph";


        /*
         * Make sure Plotly resizes
         * correctly after becoming visible.
         */

        setTimeout(function() {

            if (
                statusChartLoaded &&
                typeof Plotly !== "undefined"
            ) {

                Plotly.Plots.resize(
                    "statusChart"
                );

            }

        }, 300);

    }

    else {

        container.classList.remove(
            "show-chart"
        );


        button.textContent =
            "Show graph";

    }

}


/* =========================================================
   STATUS CHART
   ========================================================= */

function createStatusChart() {

    /*
     * Do not create chart again.
     */

    if (statusChartLoaded) {

        return;

    }


    const statusCount = {

        open: 0,

        closed: 0,

        monitoring: 0

    };


    /*
     * IMPORTANT
     *
     * Always use allData.
     *
     * Filter buttons do not affect
     * the chart.
     */

    allData.forEach(function(item) {

        const status =
            String(
                item["STATUS"] || ""
            )
            .trim()
            .toLowerCase();


        if (status === "open") {

            statusCount.open++;

        }

        else if (status === "closed") {

            statusCount.closed++;

        }

        else if (status === "monitoring") {

            statusCount.monitoring++;

        }

    });


    const total =
        statusCount.open +
        statusCount.closed +
        statusCount.monitoring;


    if (total === 0) {

        return;

    }


    const values = [

        statusCount.open,

        statusCount.closed,

        statusCount.monitoring

    ];


    const labels = [

        "Open",

        "Closed",

        "Monitoring"

    ];


    const data = [{

        type: "pie",

        values: values,

        labels: labels,

        hole: 0.08,

        textinfo: "label+percent",

        texttemplate:
            "%{label}<br>%{value} / %{percent:.1%}",

        hovertemplate:
            "<b>%{label}</b><br>" +
            "Count: %{value}<br>" +
            "Percentage: %{percent:.1%}" +
            "<extra></extra>",


        /*
         * =========================
         * CHART COLORS
         * =========================
         *
         * Open       = RED
         * Closed     = GREEN
         * Monitoring = ORANGE
         */

        marker: {

            colors: [

                "#dc3545",

                "#198754",

                "#d97706"

            ],

            line: {

                color: "#ffffff",

                width: 2

            }

        },


        pull: [

            0.04,

            0.04,

            0.04

        ],

        rotation: 0,

        direction: "clockwise",

        sort: false

    }];


    const layout = {

        margin: {

            l: 10,

            r: 10,

            t: 10,

            b: 40

        },

        showlegend: true,

        legend: {

            orientation: "h",

            x: 0.5,

            xanchor: "center",

            y: -0.05

        },

        paper_bgcolor:
            "rgba(0,0,0,0)",

        plot_bgcolor:
            "rgba(0,0,0,0)",

        height: 320,

        transition: {

            duration: 1000,

            easing: "cubic-in-out"

        }

    };


    const config = {

        responsive: true,

        displayModeBar: false

    };


    Plotly.newPlot(

        "statusChart",

        data,

        layout,

        config

    );


    /*
     * Chart is now loaded.
     *
     * Filter buttons will NOT
     * recreate it.
     */

    statusChartLoaded = true;

}


/* =========================================================
   LOAD JSON
   ========================================================= */

async function loadData() {

    try {

        const results = await Promise.all([

            fetch("data.json"),

            fetch("BU4.json"),

            fetch("D7.json"),

            fetch("BU11.json")

        ]);


        for (const response of results) {

            if (!response.ok) {

                throw new Error(
                    "Failed to load: " +
                    response.url
                );

            }

        }


        allData =
            await results[0].json();


        BU4Data =
            await results[1].json();


        D7Data =
            await results[2].json();


        BU11Data =
            await results[3].json();


        /*
         * Sort newest first
         */

        allData.sort(function(a, b) {

            const dateA =
                new Date(
                    a["DATE"] || 0
                );

            const dateB =
                new Date(
                    b["DATE"] || 0
                );

            return dateB - dateA;

        });


        filteredData =
            [...allData];


        /*
         * Create chart once.
         */

        createStatusChart();


        renderTable();


    } catch (error) {

        console.error(error);


        document.getElementById(
            "tableBody"
        ).innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="message">

                    Failed to load data.
                    Please check data.json,
                    BU4.json,
                    D7.json and BU11.json.

                </td>

            </tr>

        `;


        document.getElementById(
            "recordInfo"
        ).textContent =
            "Data loading error.";

    }

}


/* =========================================================
   SELECT BU
   ========================================================= */

function selectBU(bu) {

    if (selectedBU === bu) {

        selectedBU = null;

    }

    else {

        selectedBU = bu;

    }


    currentPage = 1;


    updateBUButtons();

    applyFilter();

}


/* =========================================================
   SELECT STATUS
   ========================================================= */

function selectStatus(status) {

    if (selectedStatus === status) {

        selectedStatus = null;

    }

    else {

        selectedStatus = status;

    }


    currentPage = 1;


    updateStatusButtons();

    applyFilter();

}


/* =========================================================
   UPDATE BU BUTTONS
   ========================================================= */

function updateBUButtons() {

    const buttons = {

        BU4:
            document.getElementById(
                "btnBU4"
            ),

        D7:
            document.getElementById(
                "btnD7"
            ),

        BU11:
            document.getElementById(
                "btnBU11"
            )

    };


    Object.keys(buttons)
        .forEach(function(bu) {

            buttons[bu]
                .classList
                .remove("active");

        });


    if (
        selectedBU &&
        buttons[selectedBU]
    ) {

        buttons[selectedBU]
            .classList
            .add("active");

    }

}


/* =========================================================
   UPDATE STATUS BUTTONS
   ========================================================= */

function updateStatusButtons() {

    const buttons = {

        open:
            document.getElementById(
                "btnOpenCase"
            ),

        closed:
            document.getElementById(
                "btnCloseCase"
            ),

        monitoring:
            document.getElementById(
                "btnMonitoringCase"
            )

    };


    Object.keys(buttons)
        .forEach(function(status) {

            buttons[status]
                .classList
                .remove("active");

        });


    if (
        selectedStatus &&
        buttons[selectedStatus]
    ) {

        buttons[selectedStatus]
            .classList
            .add("active");

    }

}


/* =========================================================
   GET BU SITE VALUE
   ========================================================= */

function getBUValue(bu) {

    if (bu === "BU4") {

        return BU4Data[0] || "";

    }


    if (bu === "D7") {

        return D7Data[0] || "";

    }


    if (bu === "BU11") {

        return BU11Data[0] || "";

    }


    return "";

}


/* =========================================================
   FILTER
   ========================================================= */

function applyFilter() {

    const issueText =
        document
            .getElementById(
                "searchIssue"
            )
            .value
            .trim()
            .toLowerCase();


    filteredData =
        allData.filter(function(item) {

            const issue =
                String(
                    item[
                        "ISSUE AND REQUEST"
                    ] || ""
                )
                .toLowerCase();


            const site =
                String(
                    item["SITE"] || ""
                )
                .toLowerCase();


            const status =
                String(
                    item["STATUS"] || ""
                )
                .trim()
                .toLowerCase();


            if (
                issueText &&
                !issue.includes(issueText)
            ) {

                return false;

            }


            if (selectedBU) {

                const buValue =
                    getBUValue(
                        selectedBU
                    )
                    .toLowerCase();


                if (
                    !site.includes(
                        buValue
                    )
                ) {

                    return false;

                }

            }


            if (selectedStatus) {

                if (
                    status !==
                    selectedStatus
                ) {

                    return false;

                }

            }


            return true;

        });


    currentPage = 1;


    renderTable();

}


/* =========================================================
   CREATE OPEN BUTTON
   ========================================================= */

function createOpenButton(value) {

    if (!value) {

        return "";

    }


    const link =
        String(value).trim();


    if (
        link === "" ||
        link.toUpperCase() ===
        "NOT AVAILABLE"
    ) {

        return "";

    }


    if (
        !/^https?:\/\//i.test(link)
    ) {

        return "";

    }


    return `

        <a
            class="open-btn"
            href="${escapeAttribute(link)}"
            target="_blank"
            rel="noopener noreferrer">

            Open

        </a>

    `;

}


/* =========================================================
   CREATE STATUS HTML
   ========================================================= */

function createStatus(value) {

    if (!value) {

        return "";

    }


    const status =
        String(value).trim();


    const normalized =
        status
            .toLowerCase()
            .replace(
                /\s+/g,
                "-"
            );


    let className =
        "status-default";


    if (
        normalized ===
        "monitoring"
    ) {

        className =
            "status-monitoring";

    }

    else if (
        normalized ===
        "closed"
    ) {

        className =
            "status-closed";

    }

    else if (
        normalized ===
        "ng"
    ) {

        className =
            "status-ng";

    }

    else if (
        normalized ===
        "open"
    ) {

        className =
            "status-open";

    }


    return `

        <span
            class="status ${className}">

            ${escapeHTML(status)}

        </span>

    `;

}


/* =========================================================
   FORMAT DATE
   ========================================================= */

function formatDate(value) {

    if (!value) {

        return "";

    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return escapeHTML(
            String(value)
        );

    }


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        )
        .padStart(2, "0");


    const day =
        String(
            date.getDate()
        )
        .padStart(2, "0");


    return `${year}-${month}-${day}`;

}


/* =========================================================
   RENDER TABLE
   ========================================================= */

function renderTable() {

    const tableBody =
        document.getElementById(
            "tableBody"
        );


    const recordInfo =
        document.getElementById(
            "recordInfo"
        );


    const pageInfo =
        document.getElementById(
            "pageInfo"
        );


    const prevBtn =
        document.getElementById(
            "prevBtn"
        );


    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    const totalRecords =
        filteredData.length;


    const totalPages =
        Math.max(
            1,
            Math.ceil(
                totalRecords /
                rowsPerPage
            )
        );


    if (
        currentPage >
        totalPages
    ) {

        currentPage =
            totalPages;

    }


    const startIndex =
        (currentPage - 1) *
        rowsPerPage;


    const endIndex =
        Math.min(
            startIndex +
            rowsPerPage,
            totalRecords
        );


    const pageData =
        filteredData.slice(
            startIndex,
            endIndex
        );


    if (
        totalRecords === 0
    ) {

        recordInfo.textContent =
            "0 records";

    }

    else {

        recordInfo.textContent =
            `Showing ${
                startIndex + 1
            }-${
                endIndex
            } of ${
                totalRecords
            } records`;

    }


    if (
        pageData.length === 0
    ) {

        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="message">

                    No records found.

                </td>

            </tr>

        `;

    }

    else {

        tableBody.innerHTML =
            pageData
                .map(function(item) {


                    const date =
                        formatDate(
                            item["DATE"]
                        );


                    const site =
                        escapeHTML(
                            item["SITE"] ||
                            ""
                        );


                    const issue =
                        escapeHTML(
                            item[
                                "ISSUE AND REQUEST"
                            ] || ""
                        );


                    const rawStatus =
                        String(
                            item["STATUS"] ||
                            ""
                        )
                        .trim();


                    const normalizedStatus =
                        rawStatus
                            .toLowerCase();


                    const status =
                        createStatus(
                            rawStatus
                        );


                    const log =
                        createOpenButton(
                            item["LOG"]
                        );


                    const ccLink =
                        createOpenButton(
                            item["CC LINK"]
                        );


                    let rowClass = "";


                    if (
                        normalizedStatus ===
                        "open"
                    ) {

                        rowClass =
                            "open-case-row";

                    }

                    else if (
                        normalizedStatus ===
                        "closed"
                    ) {

                        rowClass =
                            "closed-case-row";

                    }

                    else if (
                        normalizedStatus ===
                        "monitoring"
                    ) {

                        rowClass =
                            "monitoring-case-row";

                    }


                    return `

                        <tr
                            class="${rowClass}">

                            <td>
                                ${date}
                            </td>


                            <td>
                                ${site}
                            </td>


                            <td>
                                ${issue}
                            </td>


                            <td>
                                ${status}
                            </td>


                            <td>
                                ${log}
                            </td>


                            <td>
                                ${ccLink}
                            </td>

                        </tr>

                    `;

                })
                .join("");

    }


    pageInfo.textContent =
        `Page ${
            currentPage
        } / ${
            totalPages
        }`;


    prevBtn.disabled =
        currentPage <= 1;


    nextBtn.disabled =
        currentPage >=
        totalPages;

}


/* =========================================================
   PREVIOUS PAGE
   ========================================================= */

function previousPage() {

    if (
        currentPage > 1
    ) {

        currentPage--;

        renderTable();

        scrollToTop();

    }

}


/* =========================================================
   NEXT PAGE
   ========================================================= */

function nextPage() {

    const totalPages =
        Math.max(
            1,
            Math.ceil(
                filteredData.length /
                rowsPerPage
            )
        );


    if (
        currentPage <
        totalPages
    ) {

        currentPage++;

        renderTable();

        scrollToTop();

    }

}


/* =========================================================
   CLEAR FILTER
   ========================================================= */

function clearFilter() {

    document
        .getElementById(
            "searchIssue"
        )
        .value = "";


    selectedBU = null;

    selectedStatus = null;


    currentPage = 1;


    updateBUButtons();

    updateStatusButtons();


    filteredData =
        [...allData];


    renderTable();

}


/* =========================================================
   SCROLL TO TOP
   ========================================================= */

function scrollToTop() {

    const container =
        document.querySelector(
            ".table-container"
        );


    if (container) {

        container.scrollTop = 0;

    }


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ESCAPE ATTRIBUTE
   ========================================================= */

function escapeAttribute(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}


/* =========================================================
   START
   ========================================================= */

loadData();

</script>
