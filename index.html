<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<link
    rel="icon"
    type="image/png"
    href="folder.png"
>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NA TEAM Issue List Management</title>

<!-- PLOTLY -->
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<!-- SHEETJS (Excel export) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


<style>

/* =========================
   GLOBAL
   ========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6fa;
    color: #222;
}

body {
    min-height: 100vh;
}


/* =========================
   HEADER
   ========================= */

.header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #ffffff;
    border-bottom: 1px solid #ddd;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
}

.header-inner {
    padding: 14px 20px;
}

.title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 12px;
}


/* =========================
   SEARCH
   ========================= */

.search-area {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.search-area input {
    height: 38px;
    padding: 0 12px;
    border: 1px solid #bbb;
    border-radius: 6px;
    font-size: 14px;
    min-width: 220px;
    flex: 1;
}

.search-area input:focus {
    outline: none;
    border-color: #555;
    box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.08);
}


/* =========================
   FILTER BUTTONS
   ========================= */

.filter-area {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    align-items: center;
}

.filter-btn {
    border: none;
    border-radius: 5px;
    padding: 8px 13px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.15s ease;
}

.filter-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
}


/* =========================
   ACTIVE BUTTON
   ========================= */

.filter-btn.active {
    border: 2px solid #ff0000;

    box-shadow:
        0 4px 8px rgba(0, 0, 0, 0.30),
        0 0 0 2px rgba(255, 0, 0, 0.15);

    transform: translateY(-2px);
}


/* =========================
   BU FILTER
   ========================= */

.bu-btn {
    background: #1976d2;
    color: white;
}


/* =========================
   STATUS FILTER
   ========================= */

.status-filter-btn {
    color: white;
}

.open-case-btn {
    background: #dc3545;
}

.close-case-btn {
    background: #198754;
}

.monitoring-case-btn {
    background: #d97706;
}


/* =========================
   ADD BUTTON
   ========================= */

.add-btn {
    background: #6f42c1;
    color: white;
}

.add-btn:hover {
    background: #59359a;
}


/* =========================
   EXPORT BUTTON
   ========================= */

.export-btn {
    background: #0d7c4a;
    color: white;
}

.export-btn:hover {
    background: #0a6039;
}


/* =========================
   CLEAR
   ========================= */

.clear-btn {
    background: #d32f2f;
    color: white;
}


/* =========================
   STATUS CHART
   ========================= */

.chart-container {

    margin: 10px 20px 0 20px;

    background: #ffffff;

    border: 1px solid #ddd;

    border-radius: 7px;

    padding: 5px;

    height: 45px;

    overflow: hidden;

    transition:
        height 0.25s ease,
        padding 0.25s ease;
}

.chart-container.show-chart {

    height: 360px;

    padding: 10px;
}

.chart-header {

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    min-height: 30px;
}

.chart-title {

    text-align: center;

    font-size: 16px;

    font-weight: bold;
}

.chart-toggle-btn {

    position: absolute;

    right: 0;

    top: 0;

    border: none;

    border-radius: 5px;

    padding: 6px 10px;

    background: #555;

    color: white;

    font-size: 11px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.15s ease;
}

.chart-toggle-btn:hover {

    background: #333;

    transform: translateY(-1px);
}

.chart-container:not(.show-chart) .chart-title {

    display: none;
}

.chart-container:not(.show-chart) .chart-header {

    min-height: 33px;
}

.chart-container:not(.show-chart)
.chart-toggle-btn {

    position: static;
}

#statusChart {

    width: 100%;

    height: 320px;
}


/* =========================
   PAGINATION TOP
   ========================= */

.pagination-top {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 12px 10px;
    flex-wrap: wrap;
    background: #ffffff;
    border-bottom: 1px solid #ddd;
}

.page-btn {
    border: 1px solid #bbb;
    background: white;
    border-radius: 5px;
    padding: 7px 14px;
    cursor: pointer;
    font-size: 13px;
}

.page-btn:hover:not(:disabled) {
    background: #eee;
}

.page-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.page-info {
    font-size: 13px;
    font-weight: bold;
}


/* =========================
   RECORD COUNT
   ========================= */

.record-info {
    margin: 10px 20px 0 20px;
    font-size: 13px;
    color: #555;
}


/* =========================
   TABLE
   ========================= */

.table-container {
    margin: 10px 20px 0 20px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 7px;
    overflow: auto;
    max-height: calc(100vh - 280px);
}

table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
}


/* =========================
   TABLE HEADER
   ========================= */

thead th {
    position: sticky;
    top: 0;
    z-index: 10;

    background: #222;
    color: white;

    padding: 10px 6px;

    border: 1px solid #ddd;

    text-align: center;

    font-size: 13px;

    white-space: normal;

    word-break: break-word;
}


/* =========================
   TABLE BODY
   ========================= */

tbody td {

    border: 1px solid #ddd;

    padding: 8px 6px;

    font-size: 13px;

    vertical-align: top;

    overflow-wrap: anywhere;

    word-break: break-word;
}

tbody tr:nth-child(even) {
    background: #fafafa;
}

tbody tr:hover {
    filter: brightness(0.97);
}


/* =========================
   COLUMN WIDTH
   ========================= */

th:nth-child(1),
td:nth-child(1) {
    width: 10%;
    text-align: center;
}

th:nth-child(2),
td:nth-child(2) {
    width: 16%;
}

th:nth-child(3),
td:nth-child(3) {

    width: 40%;

    white-space: pre-line;

    text-align: left;
}

th:nth-child(4),
td:nth-child(4) {

    width: 14%;

    text-align: center;
}

th:nth-child(5),
td:nth-child(5) {

    width: 10%;

    text-align: center;
}

th:nth-child(6),
td:nth-child(6) {

    width: 10%;

    text-align: center;
}


/* =========================
   STATUS ROW COLORS
   ========================= */

tbody tr.open-case-row {
    background: #f8d7da !important;
}

tbody tr.open-case-row:hover {
    background: #f1bfc3 !important;
}

tbody tr.closed-case-row {
    background: #d4edda !important;
}

tbody tr.closed-case-row:hover {
    background: #bee5c5 !important;
}

tbody tr.monitoring-case-row {
    background: #ffe5c2 !important;
}

tbody tr.monitoring-case-row:hover {
    background: #ffd59f !important;
}


/* =========================
   STATUS BADGE
   ========================= */

.status {
    display: inline-block;

    padding: 5px 7px;

    border-radius: 5px;

    font-size: 11px;

    font-weight: bold;

    white-space: nowrap;

    max-width: 100%;
}

.status-monitoring {
    background: #fff3cd;
    color: #856404;
}

.status-closed {
    background: #d4edda;
    color: #155724;
}

.status-ng {
    background: #f8d7da;
    color: #721c24;
}

.status-open {
    background: #dc3545;
    color: white;
}

.status-default {
    background: #e2e3e5;
    color: #383d41;
}


/* =========================
   OPEN BUTTON
   ========================= */

.open-btn {
    display: inline-block;

    padding: 6px 8px;

    background: #1976d2;

    color: white;

    text-decoration: none;

    border-radius: 5px;

    font-size: 11px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.15s;
}

.open-btn:hover {
    background: #125aa0;

    transform: translateY(-1px);
}


/* =========================
   EMPTY / LOADING
   ========================= */

.message {
    text-align: center;

    padding: 30px;

    color: #666;

    font-size: 14px;
}


/* =========================================================
   ADD MODAL
   ========================================================= */

.add-modal {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 5000;

    background: rgba(0, 0, 0, 0.50);

    align-items: center;

    justify-content: center;

    padding: 15px;
}

.add-modal.show {

    display: flex;
}

.add-modal-content {

    width: 100%;

    max-width: 560px;

    max-height: 90vh;

    background: white;

    border-radius: 10px;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.35);

    overflow: hidden;

    display: flex;

    flex-direction: column;
}

.add-modal-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 15px 18px;

    background: #222;

    color: white;

    font-size: 17px;

    font-weight: bold;
}

.add-close-btn {

    border: none;

    background: transparent;

    color: white;

    font-size: 26px;

    line-height: 1;

    cursor: pointer;

    padding: 0 3px;
}

.add-close-btn:hover {

    color: #ffaaaa;
}

.add-step {

    padding: 20px;

    min-height: 190px;

    overflow-y: auto;
}

.add-step-label {

    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: bold;
}

.add-input,
.add-select,
.add-textarea {

    width: 100%;

    border: 1px solid #bbb;

    border-radius: 6px;

    padding: 10px;

    font-size: 14px;

    font-family: Arial, Helvetica, sans-serif;
}

.add-input:focus,
.add-select:focus,
.add-textarea:focus {

    outline: none;

    border-color: #1976d2;

    box-shadow:
        0 0 0 2px rgba(25,118,210,0.12);
}

.add-textarea {

    min-height: 140px;

    resize: vertical;
}

.add-error {

    margin-top: 9px;

    color: #dc3545;

    font-size: 13px;

    font-weight: bold;
}

.add-modal-footer {

    display: flex;

    justify-content: flex-end;

    gap: 8px;

    padding: 12px 18px;

    border-top: 1px solid #ddd;

    background: #fafafa;
}

.add-primary-btn,
.add-secondary-btn {

    border: none;

    border-radius: 5px;

    padding: 8px 16px;

    cursor: pointer;

    font-size: 13px;

    font-weight: bold;
}

.add-primary-btn {

    background: #1976d2;

    color: white;
}

.add-secondary-btn {

    background: #777;

    color: white;
}

.add-primary-btn:hover {

    background: #125aa0;
}

.add-secondary-btn:hover {

    background: #555;
}

.add-primary-btn:disabled {

    opacity: 0.55;

    cursor: wait;
}

.add-secondary-btn:disabled {

    opacity: 0.55;

    cursor: wait;
}


/* =========================
   CONFIRM
   ========================= */

.add-confirm-row {

    margin-bottom: 12px;

}

.add-confirm-label {

    font-size: 12px;

    color: #666;

    font-weight: bold;

    margin-bottom: 3px;
}

.add-confirm-value {

    padding: 8px;

    background: #f5f5f5;

    border: 1px solid #e2e2e2;

    border-radius: 5px;

    white-space: pre-wrap;

    word-break: break-word;

    font-size: 13px;
}


/* =========================
   SECURE BACKEND NOTE
   ========================= */

.backend-note {

    margin-top: 18px;

    padding: 10px 12px;

    background: #f0f7ff;

    border: 1px solid #c9e2ff;

    border-radius: 6px;

    color: #24527a;

    font-size: 12px;

    line-height: 1.5;
}

/* =========================
   TOAST
   ========================= */

.toast {

    position: fixed;

    left: 50%;

    bottom: 24px;

    transform: translateX(-50%) translateY(16px);

    z-index: 6000;

    max-width: 90vw;

    padding: 11px 18px;

    border-radius: 7px;

    background: #333;

    color: white;

    font-size: 13px;

    font-weight: bold;

    text-align: center;

    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.2s ease,
        transform 0.2s ease;
}

.toast.show {

    opacity: 1;

    transform: translateX(-50%) translateY(0);
}

.toast.info {

    background: #333;
}

.toast.success {

    background: #198754;
}

.toast.error {

    background: #dc3545;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 768px) {

    .header-inner {
        padding: 10px;
    }

    .title {
        font-size: 20px;
        margin-bottom: 10px;
    }

    .search-area {
        flex-direction: column;
    }

    .search-area input {
        width: 100%;
        min-width: 0;
    }

    .filter-area {
        gap: 5px;
    }

    .filter-btn {
        padding: 7px 9px;
        font-size: 11px;
    }


    /* CHART */

    .chart-container {

        margin: 10px;

        height: 40px;

        padding: 4px;
    }

    .chart-container.show-chart {

        height: 300px;

        padding: 5px;
    }

    .chart-title {

        font-size: 14px;
    }

    .chart-toggle-btn {

        font-size: 9px;

        padding: 5px 8px;
    }

    #statusChart {

        height: 265px;
    }


    /* PAGINATION */

    .pagination-top {
        padding: 10px 5px;
    }


    /* TABLE */

    .table-container {

        margin: 10px;

        max-height: calc(100vh - 330px);

        overflow-x: hidden;
    }

    .record-info {

        margin: 8px 10px 0 10px;
    }

    thead th {

        padding: 8px 3px;

        font-size: 11px;
    }

    tbody td {

        padding: 7px 3px;

        font-size: 11px;

        vertical-align: top;
    }


    /* STATUS */

    .status {

        font-size: 8px;

        padding: 4px 4px;

        white-space: normal;
    }


    /* OPEN BUTTON */

    .open-btn {

        font-size: 6px;

        padding: 5px 4px;
    }


    /* ADD */

    .add-modal {

        padding: 10px;
    }

    .add-modal-content {

        max-height: 94vh;
    }

    .add-modal-header {

        padding: 12px 14px;

        font-size: 15px;
    }

    .add-step {

        padding: 15px;

        min-height: 170px;
    }

    .add-modal-footer {

        padding: 10px 15px;
    }

}


/* =========================
   VERY SMALL PHONE
   ========================= */

@media (max-width: 400px) {

    .filter-btn {

        padding: 6px 7px;

        font-size: 10px;
    }

    thead th {

        font-size: 10px;
    }

    tbody td {

        font-size: 10px;

        vertical-align: top;
    }

    .page-btn {

        padding: 6px 9px;

        font-size: 11px;
    }

    .chart-container.show-chart {

        height: 270px;
    }

    #statusChart {

        height: 235px;
    }

    .add-primary-btn,
    .add-secondary-btn {

        padding: 7px 12px;

        font-size: 11px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
     ========================================================= -->

<div class="header">

    <div class="header-inner">

        <div class="title">
            NA TEAM Issue List Management
        </div>


        <!-- SEARCH -->

        <div class="search-area">

            <input
                type="text"
                id="searchIssue"
                placeholder="Search Issue and Request..."
                oninput="applyFilter()"
            >

        </div>


        <!-- FILTERS -->

        <div class="filter-area">


            <!-- BU FILTERS -->

            <button
                class="filter-btn bu-btn"
                id="btnBU4"
                onclick="selectBU('BU4')">

                BU4

            </button>


            <button
                class="filter-btn bu-btn"
                id="btnD7"
                onclick="selectBU('D7')">

                D7

            </button>


            <button
                class="filter-btn bu-btn"
                id="btnBU11"
                onclick="selectBU('BU11')">

                BU11

            </button>


            <!-- VISION FILTER -->

            <button
                class="filter-btn bu-btn"
                id="btnVISION"
                onclick="selectBU('VISION')">

                VISION

            </button>


            <!-- STATUS FILTERS -->

            <button
                class="filter-btn status-filter-btn open-case-btn"
                id="btnOpenCase"
                onclick="selectStatus('open')">

                OPEN CASE

            </button>


            <button
                class="filter-btn status-filter-btn close-case-btn"
                id="btnCloseCase"
                onclick="selectStatus('closed')">

                CLOSE CASE

            </button>


            <button
                class="filter-btn status-filter-btn monitoring-case-btn"
                id="btnMonitoringCase"
                onclick="selectStatus('monitoring')">

                Monitoring CASE

            </button>


            <!-- CLEAR -->

            <button
                class="filter-btn clear-btn"
                onclick="clearFilter()">

                CLEAR

            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     STATUS CHART
     ========================================================= -->

<div
    class="chart-container"
    id="chartContainer"
>

    <div class="chart-header">

        <div class="chart-title">
            Issue Status Overview
        </div>


        <button
            class="chart-toggle-btn"
            id="chartToggleBtn"
            onclick="toggleChart()">

            Show graph

        </button>

    </div>


    <div id="statusChart"></div>

</div>


<!-- =========================================================
     PAGINATION
     ========================================================= -->

<div class="pagination-top">

    <button
        class="page-btn"
        id="prevBtn"
        onclick="previousPage()">

        Previous

    </button>


    <span
        class="page-info"
        id="pageInfo">

        Page 1

    </span>


    <button
        class="page-btn"
        id="nextBtn"
        onclick="nextPage()">

        Next

    </button>


    <button
        class="filter-btn add-btn"
        onclick="openAddDialog()">

        Add Case

    </button>


    <button
        class="filter-btn export-btn"
        onclick="exportToExcel()">

        Export Excel

    </button>

</div>


<!-- =========================================================
     RECORD INFO
     ========================================================= -->

<div
    class="record-info"
    id="recordInfo">

    Loading...

</div>


<!-- =========================================================
     TABLE
     ========================================================= -->

<div class="table-container">

    <table>

        <thead>

            <tr>

                <th>DATE</th>

                <th>SITE</th>

                <th>ISSUE AND REQUEST</th>

                <th>STATUS</th>

                <th>LOG</th>

                <th>CC LINK</th>

            </tr>

        </thead>


        <tbody id="tableBody">
        </tbody>

    </table>

</div>


<!-- =========================================================
     ADD MODAL
     ========================================================= -->

<div
    class="add-modal"
    id="addModal"
>

    <div class="add-modal-content">


        <!-- HEADER -->

        <div class="add-modal-header">

            <span id="addStepTitle">
                Add New Issue
            </span>


            <button
                onclick="closeAddDialog()"
                class="add-close-btn"
                title="Close">

                ×

            </button>

        </div>


        <!-- CONTENT -->

        <div
            class="add-step"
            id="addStepContent">
        </div>


        <!-- FOOTER -->

        <div class="add-modal-footer">

            <button
                id="addBackBtn"
                class="add-secondary-btn"
                onclick="addPreviousStep()">

                Back

            </button>


            <button
                id="addNextBtn"
                class="add-primary-btn"
                onclick="addNextStep()">

                Next

            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     TOAST
     ========================================================= -->

<div
    id="toast"
    class="toast">
</div>


<script>


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let allData = [];

let filteredData = [];

let currentPage = 1;

const rowsPerPage = 50;

let selectedBU = null;

let selectedStatus = null;

let toastTimer = null;


/* =========================================================
   TOAST NOTIFICATION
   ========================================================= */

function showToast(message, type, duration) {

    const toast =
        document.getElementById(
            "toast"
        );


    if (!toast) {

        return;

    }


    if (toastTimer) {

        clearTimeout(
            toastTimer
        );

    }


    toast.textContent =
        message;


    toast.className =
        "toast show " +
        (type || "info");


    toastTimer =
        setTimeout(function() {

            toast.classList.remove(
                "show"
            );

        }, duration || 3000);

}


/* =========================================================
   CHART CONTROL
   ========================================================= */

let statusChartLoaded = false;

let chartVisible = false;


/* =========================================================
   BU DATA
   ========================================================= */

let BU4Data = [];

let D7Data = [];

let BU11Data = [];

let VISIONData = [];


/* =========================================================
   ADD RECORD
   ========================================================= */

let addStep = 1;

let newRecord = {

    DATE: "",

    SITE: "",

    "ISSUE AND REQUEST": "",

    STATUS: "",

    LOG: "",

    "CC LINK": ""

};


/* =========================================================
   CLOUDFLARE WORKER
   ========================================================= */

const BACKEND_API_URL =
    "https://issue-list-backend.quoctan91.workers.dev/add-issue";


/* =========================================================
   TOGGLE CHART
   ========================================================= */

function toggleChart() {

    const container =
        document.getElementById(
            "chartContainer"
        );


    const button =
        document.getElementById(
            "chartToggleBtn"
        );


    chartVisible =
        !chartVisible;


    if (chartVisible) {

        container.classList.add(
            "show-chart"
        );


        button.textContent =
            "Hide Graph";


        setTimeout(function() {

            if (
                statusChartLoaded &&
                typeof Plotly !== "undefined"
            ) {

    else {

}


/* =========================================================
   STATUS CHART
   ========================================================= */

function computeChartData() {

    const statusCount = {

        open: 0,

        closed: 0,

        monitoring: 0

    };


    allData.forEach(function(item) {

        const status =
            String(
                item["STATUS"] || ""
            )
            .trim()
            .toLowerCase();


        if (status === "open") {

            statusCount.open++;

        }

        else if (status === "closed") {

            statusCount.closed++;

        }

        else if (status === "monitoring") {

            statusCount.monitoring++;

        }

    });


    const total =
        statusCount.open +
        statusCount.closed +
        statusCount.monitoring;


    if (total === 0) {

        return null;

    }


    const values = [

        statusCount.open,

        statusCount.closed,

        statusCount.monitoring

    ];


    const labels = [

        "Open",

        "Closed",

        "Monitoring"

    ];


    const data = [{

        type: "pie",

        values: values,

        labels: labels,

        hole: 0.08,

        textinfo: "label+percent",

        texttemplate:
            "%{label}<br>%{value} / %{percent:.1%}",

        hovertemplate:
            "<b>%{label}</b><br>" +
            "Count: %{value}<br>" +
            "Percentage: %{percent:.1%}" +
            "<extra></extra>",

        marker: {

            colors: [

                "#dc3545",

                "#198754",

                "#d97706"

            ],

            line: {

                color: "#ffffff",

                width: 2

            }

        },

        pull: [

            0.04,

            0.04,

            0.04

        ],

        rotation: 0,

        direction: "clockwise",

        sort: false

    }];


    const layout = {

        margin: {

            l: 10,

            r: 10,

            t: 10,

            b: 40

        },

        showlegend: true,

        legend: {

            orientation: "h",

            x: 0.5,

            xanchor: "center",

            y: -0.05

        },

        paper_bgcolor:
            "rgba(0,0,0,0)",

        plot_bgcolor:
            "rgba(0,0,0,0)",

        height: 320,

        transition: {

            duration: 1000,

            easing: "cubic-in-out"

        }

    };


    const config = {

        responsive: true,

        displayModeBar: false

    };


    return {

        data: data,

        layout: layout,

        config: config

    };

}


/* =========================================================
   CREATE CHART (first render only)
   ========================================================= */

function createStatusChart() {

    if (statusChartLoaded) {

        return;

    }


    const chart =
        computeChartData();


    if (!chart) {

        return;

    }


    Plotly.newPlot(

        "statusChart",

        chart.data,

        chart.layout,

        chart.config

    );


    statusChartLoaded = true;

}


/* =========================================================
   UPDATE CHART (cheap in-place update)
   ========================================================= */

function updateStatusChart() {

    const chart =
        computeChartData();


    if (!chart) {

        return;

    }


    if (!statusChartLoaded) {

        Plotly.newPlot(

            "statusChart",

            chart.data,

            chart.layout,

            chart.config

        );


        statusChartLoaded = true;


        return;

    }


    /*
     * Plotly.react diffs against the
     * existing plot and only updates
     * what changed, instead of tearing
     * down and rebuilding the whole
     * chart like purge + newPlot did.
     */

    Plotly.react(

        "statusChart",

        chart.data,

        chart.layout,

        chart.config

    );

}

/* =========================================================
   DATE PARSER
   ========================================================= */

function parseDate(value) {

    if (!value) {

        return 0;

    }


    const text =
        String(value).trim();


    /*
     * MM/DD/YY
     */

    const match =
        text.match(
            /^(\d{2})\/(\d{2})\/(\d{2})$/
        );


    if (match) {

        const month =
            Number(match[1]);

        const day =
            Number(match[2]);

        const year =
            2000 + Number(match[3]);


        const date =
            new Date(
                year,
                month - 1,
                day
            );


        return date.getTime();

    }


    /*
     * Fallback for existing data
     */

    const date =
        new Date(value);


    if (
        isNaN(date.getTime())
    ) {

        return 0;

    }


    return date.getTime();

}


/* =========================================================
   SORT DATA
   ========================================================= */

function sortData() {

    /*
     * Precompute the sort key once per
     * item instead of calling parseDate()
     * repeatedly inside the comparator
     * (a comparator runs O(n log n) times,
     * parseDate() involves a regex + Date
     * construction, so caching it up front
     * is noticeably cheaper on larger lists).
     */

    const keyed =
        allData.map(function(item) {

            return {

                item: item,

                key: parseDate(
                    item["DATE"]
                )

            };

        });


    keyed.sort(function(a, b) {

        return b.key - a.key;

    });


    allData =
        keyed.map(function(entry) {

            return entry.item;

        });

}

/* =========================================================
   GET ALL CUSTOMERS
   ========================================================= */

function getAllCustomers() {

    const customers = [];


    function addCustomer(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return;

        }


        const text =
            String(value).trim();


        if (
            text === ""
        ) {

            return;

        }


        if (
            !customers.includes(text)
        ) {

            customers.push(text);

        }

    }


    if (
        BU4Data.length > 0
    ) {

        addCustomer(
            BU4Data[0]
        );

    }


    if (
        D7Data.length > 0
    ) {

        addCustomer(
            D7Data[0]
        );

    }


    if (
        BU11Data.length > 0
    ) {

        addCustomer(
            BU11Data[0]
        );

    }


    if (
        VISIONData.length > 0
    ) {

        addCustomer(
            VISIONData[0]
        );

    }


    return customers.sort();

}


/* =========================================================
   FILTER
   ========================================================= */

function applyFilter() {

    const issueText =
        document
            .getElementById(
                "searchIssue"
            )
            .value
            .trim()
            .toLowerCase();


    filteredData =
        allData.filter(function(item) {

            const issue =
                String(
                    item[
                        "ISSUE AND REQUEST"
                    ] || ""
                )
                .toLowerCase();


            const site =
                String(
                    item["SITE"] || ""
                )
                .toLowerCase();


            const status =
                String(
                    item["STATUS"] || ""
                )
                .trim()
                .toLowerCase();


            if (
                issueText &&
                !issue.includes(issueText)
            ) {

                return false;

            }


            if (selectedBU) {

                const buValue =
                    getBUValue(
                        selectedBU
                    )
                    .toLowerCase();


                if (
                    !site.includes(
                        buValue
                    )
                ) {

                    return false;

                }

            }


            if (selectedStatus) {

                if (
                    status !==
                    selectedStatus
                ) {

                    return false;

                }

            }


            return true;

        });


    currentPage = 1;


    renderTable();

}


/* =========================================================
   CREATE OPEN BUTTON
   ========================================================= */

function createOpenButton(value) {

    if (!value) {

        return "";

    }


    const link =
        String(value).trim();


    if (
        link === "" ||
        link.toUpperCase() ===
        "NOT AVAILABLE"
    ) {

        return "";

    }


    if (
        !/^https?:\/\//i.test(link)
    ) {

        return "";

    }


    return `

        <a
            class="open-btn"
            href="${escapeAttribute(link)}"
            target="_blank"
            rel="noopener noreferrer">

            Open

        </a>

    `;

}


/* =========================================================
   CREATE STATUS HTML
   ========================================================= */

function createStatus(value) {

    if (!value) {

        return "";

    }


    const status =
        String(value).trim();


    const normalized =
        status
            .toLowerCase()
            .replace(
                /\s+/g,
                "-"
            );


    let className =
        "status-default";


    if (
        normalized ===
        "monitoring"
    ) {

        className =
            "status-monitoring";

    }

    else if (
        normalized ===
        "closed"
    ) {

        className =
            "status-closed";

    }

    else if (
        normalized ===
        "ng"
    ) {

        className =
            "status-ng";

    }

    else if (
        normalized ===
        "open"
    ) {

        className =
            "status-open";

    }


    return `

        <span
            class="status ${className}">

            ${escapeHTML(status)}

        </span>

    `;

}


/* =========================================================
   FORMAT DATE
   ========================================================= */

function formatDate(value) {

    if (!value) {

        return "";

    }


    const text =
        String(value).trim();


    /*
     * Preserve MM/DD/YY
     * if already in correct format.
     */

    if (
        /^\d{2}\/\d{2}\/\d{2}$/.test(text)
    ) {

        return escapeHTML(text);

    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return escapeHTML(
            text
        );

    }


    const month =
        String(
            date.getMonth() + 1
        )
        .padStart(2, "0");


    const day =
        String(
            date.getDate()
        )
        .padStart(2, "0");


    const year =
        String(
            date.getFullYear()
        )
        .slice(-2);


    return `${month}/${day}/${year}`;

}


/* =========================================================
   RENDER TABLE
   ========================================================= */

function renderTable() {

    const tableBody =
        document.getElementById(
            "tableBody"
        );


    const recordInfo =
        document.getElementById(
            "recordInfo"
        );


    const pageInfo =
        document.getElementById(
            "pageInfo"
        );


    const prevBtn =
        document.getElementById(
            "prevBtn"
        );


    const nextBtn =
        document.getElementById(
            "nextBtn"
        );


    const totalRecords =
        filteredData.length;


    const totalPages =
        Math.max(
            1,
            Math.ceil(
                totalRecords /
                rowsPerPage
            )
        );


    if (
        currentPage >
        totalPages
    ) {

        currentPage =
            totalPages;

    }


    const startIndex =
        (currentPage - 1) *
        rowsPerPage;


    const endIndex =
        Math.min(
            startIndex +
            rowsPerPage,
            totalRecords
        );


    const pageData =
        filteredData.slice(
            startIndex,
            endIndex
        );


    if (
        totalRecords === 0
    ) {

        recordInfo.textContent =
            "0 records";

    }

    else {

        recordInfo.textContent =
            `Showing ${
                startIndex + 1
            }-${
                endIndex
            } of ${
                totalRecords
            } records`;

    }


    if (
        pageData.length === 0
    ) {

        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="message">

                    No records found.

                </td>

            </tr>

        `;

    }

    else {

        tableBody.innerHTML =
            pageData
                .map(function(item) {

                    const date =
                        formatDate(
                            item["DATE"]
                        );


                    const site =
                        escapeHTML(
                            item["SITE"] ||
                            ""
                        );


                    const issue =
                        escapeHTML(
                            item[
                                "ISSUE AND REQUEST"
                            ] || ""
                        );


                    const rawStatus =
                        String(
                            item["STATUS"] ||
                            ""
                        )
                        .trim();


                    const normalizedStatus =
                        rawStatus
                            .toLowerCase();


                    const status =
                        createStatus(
                            rawStatus
                        );


                    const log =
                        createOpenButton(
                            item["LOG"]
                        );


                    const ccLink =
                        createOpenButton(
                            item["CC LINK"]
                        );


                    let rowClass = "";


                    if (
                        normalizedStatus ===
                        "open"
                    ) {

                        rowClass =
                            "open-case-row";

                    }

                    else if (
                        normalizedStatus ===
                        "closed"
                    ) {

                        rowClass =
                            "closed-case-row";

                    }

                    else if (
                        normalizedStatus ===
                        "monitoring"
                    ) {

                        rowClass =
                            "monitoring-case-row";

                    }


                    return `

                        <tr
                            class="${rowClass}">

                            <td>
                                ${date}
                            </td>


                            <td>
                                ${site}
                            </td>


                            <td>
                                ${issue}
                            </td>


                            <td>
                                ${status}
                            </td>


                            <td>
                                ${log}
                            </td>


                            <td>
                                ${ccLink}
                            </td>

                        </tr>

                    `;

                })
                .join("");

    }


    pageInfo.textContent =
        `Page ${
            currentPage
        } / ${
            totalPages
        }`;


    prevBtn.disabled =
        currentPage <= 1;


    nextBtn.disabled =
        currentPage >=
        totalPages;

}


/* =========================================================
   PREVIOUS PAGE
   ========================================================= */

function previousPage() {

    if (
        currentPage > 1
    ) {

        currentPage--;

        renderTable();

        scrollToTop();

    }

}


/* =========================================================
   NEXT PAGE
   ========================================================= */

function nextPage() {

    const totalPages =
        Math.max(
            1,
            Math.ceil(
                filteredData.length /
                rowsPerPage
            )
        );


    if (
        currentPage <
        totalPages
    ) {

        currentPage++;

        renderTable();

        scrollToTop();

    }

}

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ESCAPE ATTRIBUTE
   ========================================================= */

function escapeAttribute(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}


/* =========================================================
   EXPORT TO EXCEL
   ========================================================= */

async function exportToExcel() {

    if (
        typeof XLSX === "undefined"
    ) {

        alert(
            "Excel export library failed to load. Please check your internet connection and try again."
        );

        return;

    }


    if (
        !filteredData ||
        filteredData.length === 0
    ) {

        alert(
            "No data to export."
        );

        return;

    }


    /*
     * Build plain rows in the same
     * column order as the table.
     */

    const rows =
        filteredData.map(function(item) {

            return {

                "DATE":
                    formatDateForExport(
                        item["DATE"]
                    ),

                "SITE":
                    item["SITE"] || "",

                "ISSUE AND REQUEST":
                    item[
                        "ISSUE AND REQUEST"
                    ] || "",

                "STATUS":
                    item["STATUS"] || "",

                "LOG":
                    item["LOG"] || "",

                "CC LINK":
                    item["CC LINK"] || ""

            };

        });


    const worksheet =
        XLSX.utils.json_to_sheet(
            rows
        );


    /*
     * Reasonable column widths
     */

    worksheet["!cols"] = [

        { wch: 10 },

        { wch: 18 },

        { wch: 60 },

        { wch: 14 },

        { wch: 25 },

        { wch: 25 }

    ];


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Issue List"
    );


    const now = new Date();


    const stamp =
        now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, "0") +
        String(now.getDate()).padStart(2, "0") +
        "_" +
        String(now.getHours()).padStart(2, "0") +
        String(now.getMinutes()).padStart(2, "0");


    const suggestedName =
        `Issue_List_${stamp}.xlsx`;


    /*
     * Preferred path: File System Access API.
     * Lets the user choose the save location
     * and the file name via a native dialog.
     * Supported in Chrome / Edge (desktop).
     */

    if (
        window.showSaveFilePicker
    ) {

        try {

            const handle =
                await window.showSaveFilePicker({

                    suggestedName:
                        suggestedName,

                    types: [{

                        description:
                            "Excel Workbook",

                        accept: {

                            "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":
                                [".xlsx"]

                        }

                    }]

                });


            const arrayBuffer =
                XLSX.write(
                    workbook,
                    {

                        bookType:
                            "xlsx",

                        type:
                            "array"

                    }
                );


            const writable =
                await handle.createWritable();


            await writable.write(
                arrayBuffer
            );


            await writable.close();


            return;

        }

        catch (error) {

            /*
             * User cancelled the
             * save dialog: do nothing.
             */

            if (
                error &&
                error.name ===
                "AbortError"
            ) {

                return;

            }


            console.error(
                "Save dialog failed, falling back to default download:",
                error
            );

            /*
             * Fall through to the
             * default download below.
             */

        }

    }


    /*
     * Fallback: browsers without the
     * File System Access API (Firefox,
     * Safari, mobile browsers). This
     * triggers the browser's normal
     * download flow; if the browser
     * setting "Ask where to save each
     * file" is enabled, it will still
     * prompt for a location.
     */

    XLSX.writeFile(

        workbook,

        suggestedName

    );

}


/* =========================================================
   FORMAT DATE FOR EXPORT (plain text, no HTML escaping)
   ========================================================= */

function formatDateForExport(value) {

    if (!value) {

        return "";

    }


    const text =
        String(value).trim();


    if (
        /^\d{2}\/\d{2}\/\d{2}$/.test(text)
    ) {

        return text;

    }


    const date =
        new Date(value);


    if (
        isNaN(date.getTime())
    ) {

        return text;

    }


    const month =
        String(date.getMonth() + 1)
        .padStart(2, "0");


    const day =
        String(date.getDate())
        .padStart(2, "0");


    const year =
        String(date.getFullYear())
        .slice(-2);


    return `${month}/${day}/${year}`;

}

/* =========================================================
   CONVERT MM/DD/YY -> YYYY-MM-DD (ISO, for <input type="date">)
   ========================================================= */

function convertMMDDYYToISO(value) {

    if (!value) {

        return "";

    }


    const text =
        String(value).trim();


    const match =
        text.match(
            /^(\d{2})\/(\d{2})\/(\d{2})$/
        );


    if (!match) {

        return "";

    }


    const month = match[1];

    const day = match[2];

    const year =
        "20" + match[3];


    return `${year}-${month}-${day}`;

}


/* =========================================================
   CONVERT YYYY-MM-DD (ISO) -> MM/DD/YY
   ========================================================= */

function convertISOToMMDDYY(value) {

    if (!value) {

        return "";

    }


    const match =
        String(value)
            .trim()
            .match(
                /^(\d{4})-(\d{2})-(\d{2})$/
            );


    if (!match) {

        return "";

    }


    const year =
        match[1].slice(-2);

    const month = match[2];

    const day = match[3];


    return `${month}/${day}/${year}`;

}


/* =========================================================
   VALIDATE DATE MM/DD/YY
   ========================================================= */

function validateDateMMDDYY(value) {

    const regex =
        /^(0[1-9]|1[0-2])\/(0[1-9]|[12][0-9]|3[01])\/([0-9]{2})$/;


    if (
        !regex.test(value)
    ) {

        return false;

    }


    const parts =
        value.split("/");


    const month =
        Number(parts[0]);


    const day =
        Number(parts[1]);


    const year =
        2000 +
        Number(parts[2]);


    const date =
        new Date(
            year,
            month - 1,
            day
        );


    return (

        date.getFullYear() ===
        year &&

        date.getMonth() ===
        month - 1 &&

        date.getDate() ===
        day

    );

}


/* =========================================================
   ADD NEXT STEP
   ========================================================= */

function addNextStep() {

    const error =
        document.getElementById(
            "addError"
        );

        if (!isoValue) {

                "Please select a date.";

                isoValue
            );


        if (
            !validateDateMMDDYY(value)

            error.textContent =
                "Invalid date. Please select a valid date.";

            return;

        }

            value;

        newRecord.SITE =
            value;

    /*

/* =========================================================
   SAVE NEW RECORD THROUGH CLOUDFLARE WORKER
   ========================================================= */

async function saveNewRecord() {

    /*
     * Record sent to Worker
     */

    const recordToSend = {

        DATE:
            newRecord.DATE,

        SITE:
            newRecord.SITE,

        "ISSUE AND REQUEST":
            newRecord[
                "ISSUE AND REQUEST"
            ],

        STATUS:
            newRecord.STATUS

    };


    /*
     * =========================================================
     * OPTIMISTIC UPDATE
     *
     * Show the new record on screen right
     * away instead of waiting for the
     * Cloudflare Worker round-trip. If the
     * save later fails, the record is
     * removed again and the person is told
     * via the toast.
     * =========================================================
     */

    const pendingId =
        "pending_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2);


    const optimisticRecord = {

        DATE:
            recordToSend.DATE,

        SITE:
            recordToSend.SITE,

        "ISSUE AND REQUEST":
            recordToSend[
                "ISSUE AND REQUEST"
            ],

        STATUS:
            recordToSend.STATUS,

        LOG:
            "",

        "CC LINK":
            "",

        _pendingId:
            pendingId

    };


    allData.push(
        optimisticRecord
    );


    sortData();


    /*
     * Reset filters so the new
     * record is visible right away
     */

    selectedBU =
        null;

    selectedStatus =
        null;


    updateBUButtons();

    updateStatusButtons();


    const searchInput =
        document.getElementById(
            "searchIssue"
        );


    if (searchInput) {

        searchInput.value =
            "";

    }


    filteredData =
        [...allData];


    currentPage =
        1;


    renderTable();

    updateStatusChart();


    /*
     * Close the modal immediately —
     * no need to keep the person
     * waiting on the network.
     */

    closeAddDialog();


    showToast(
        "Đang lưu...",
        "info"
    );


    /*
     * =========================================================
     * BACKGROUND SAVE
     * =========================================================
     */

    try {

        const response =
            await fetch(
                BACKEND_API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            recordToSend
                        )

                }
            );


        let result;


        try {

            result =
                await response.json();

        }

        catch (error) {

            throw new Error(
                "Invalid response from Cloudflare Worker."
            );

        }


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.message ||
                "Failed to save record."
            );

        }


        /*
         * Replace the optimistic
         * record with the confirmed
         * one from the Worker.
         */

        const savedRecord =
            result.record ||
            {

                DATE:
                    recordToSend.DATE,

                SITE:
                    recordToSend.SITE,

                "ISSUE AND REQUEST":
                    recordToSend[
                        "ISSUE AND REQUEST"
                    ],

                STATUS:
                    recordToSend.STATUS,

                LOG:
                    "",

                "CC LINK":
                    ""

            };


        const index =
            allData.findIndex(
                function(item) {

                    return (
                        item._pendingId ===
                        pendingId
                    );

                }
            );


        if (index !== -1) {

            allData[index] =
                savedRecord;

        }

        else {

            allData.push(
                savedRecord
            );

        }


        sortData();


        filteredData =
            [...allData];


        renderTable();

        updateStatusChart();


        showToast(
            "Record added successfully.",
            "success"
        );

    }

    catch (error) {

        console.error(
            "Backend save error:",
            error
        );


        /*
         * Roll back the optimistic
         * record since the save failed.
         */

        allData =
            allData.filter(
                function(item) {

                    return (
                        item._pendingId !==
                        pendingId
                    );

                }
            );


        filteredData =
            [...allData];


        renderTable();

        updateStatusChart();


        showToast(
            "Save failed: " +
            error.message +
            " — record was not saved.",
            "error",
            5000
        );

    }

}
